<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaintSim Player</title>
<style>
  :root{--bg:#191715;--panel:#23201d;--line:#3a352f;--ink:#e8dfcc;--dim:#a0978a;--acc:#d9b25a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{border-bottom:1px solid var(--line);padding:9px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  h1{font:600 15px/1.2 Georgia,"Times New Roman",serif;margin:0 6px 0 0}
  button,select,.chip{font:inherit;color:var(--ink);background:#2c2823;border:1px solid #4a4237;border-radius:4px;padding:3px 9px;cursor:pointer}
  button:hover,.chip:hover{background:#3a342c}
  #status{color:var(--dim);margin-left:auto}
  main{padding:10px 16px 60px;max-width:1280px;margin:0 auto}
  #note{color:var(--dim);margin:0 0 8px;max-width:90ch}
  #stages{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
  .chip.on{border-color:var(--acc);color:var(--acc)}.chip.past{color:var(--dim)}
  canvas{display:block;width:100%;height:auto;max-height:82vh;object-fit:contain;background:#23201d;border:1px solid var(--line);border-radius:6px}
  #problems{white-space:pre-wrap;color:#e08a6a;background:var(--panel);border:1px solid #6b3a2a;border-radius:6px;padding:10px 12px;margin:0 0 10px}
  details{margin-top:14px}summary{cursor:pointer;color:var(--acc);font:600 14px/1.2 Georgia,serif}
  textarea{width:100%;min-height:340px;margin-top:8px;background:#171513;color:#d9d0bd;border:1px solid var(--line);border-radius:4px;padding:8px;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  body.drop canvas{border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1 id="title">PaintSim player</h1>
  <button id="again">Paint again</button>
  <button id="skip">Skip to the end</button>
  <label>Light <select id="light"></select></label>
  <label>Size <select id="scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option><option value="4">4×</option></select></label>
  <button id="save">Save PNG</button>
  <button id="open">Open a painting…</button><input id="file" type="file" accept=".json,application/json" hidden>
  <span id="status"></span>
</header>
<main>
  <p id="note"></p>
  <div id="stages"></div>
  <pre id="problems" hidden></pre>
  <canvas id="cv" width="16" height="16"></canvas>
  <details>
    <summary>The painting as data</summary>
    <textarea id="json" spellcheck="false"></textarea>
    <div style="margin-top:6px"><button id="apply">Paint this</button> <span style="color:var(--dim)">Edit the text and paint it; or drop a .json file anywhere on the page.</span></div>
  </details>
</main>

<script>
/*! PaintSim 0.7 — a small physical paint simulator for the browser.

    A stroke is a bundle of bristles. Each bristle carries its own colour and paint load, lays down
    pigment AND thickness, runs dry on the tooth of the ground and can pick up wet colour beneath it.
    A paint is data (a "material recipe"): colour, body, gloss, metal, flakes, weathering.
    The finished relief is photographed under a raking lamp, so ridges, leaf and flakes catch the light.

    PaintSim.create({canvas, width, height, scale, ground, seed})  → a surface
      surface.paint({material, brush, path, width, pressure, color, opacity})
      surface.fill({material, shape, soft})      surface.dot({material, at, r})
      surface.render()                           surface.light({azimuth, elevation})

const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-s*f),t=v*(1-s*(1-f));
  return i===0?[v,t,p]:i===1?[q,v,p]:i===2?[p,v,t]:i===3?[p,q,v]:i===4?[t,p,v]:[v,p,q]}
// distance to the nearest border of a jittered Voronoi tiling, in cell units (0 on a border)
function cellEdge(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;let md=8,mx=0,my=0,mi=0,mj=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const px=i+hash(ix+i,iy+j)-fx,py=j+hash(ix+i+57,iy+j+113)-fy,d=px*px+py*py;if(d<md){md=d;mx=px;my=py;mi=i;mj=j}}
  let e=8;
  for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){if(!i&&!j)continue;const ci=mi+i,cj=mj+j,px=ci+hash(ix+ci,iy+cj)-fx,py=cj+hash(ix+ci+57,iy+cj+113)-fy,dx=px-mx,dy=py-my,l=dx*dx+dy*dy;
    if(l>1e-9){const d=((mx+px)*.5*dx+(my+py)*.5*dy)/Math.sqrt(l);if(d<e)e=d}}
  return e}
// fbm value above which a fraction `a` of the area lies, read off the measured distribution of the noise itself
const QT=(()=>{const v=new Float32Array(8192);for(let i=0;i<v.length;i++)v[i]=fbm(hash(i,7)*4096+i*.731,hash(i,91)*4096+i*.377,4);return v.sort()})();

/* ====================================================================== geometry */
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)}

function within(defs,fn){const prev=LOCAL;LOCAL=defs||null;try{return fn()}finally{LOCAL=prev}}
const mergeDefs=(a,b)=>{const o={};for(const k of Object.values(KIND_KEY))o[k]=Object.assign({},a&&a[k],b&&b[k]);return o};
// a colour is '#hex', [r,g,b] (0–1), a pigment name, {color, scatter, strength} or {mix:{name: parts, …}}.
// It comes back as [r, g, b, scatter, strength]; the last two may be missing and then get their defaults when mixed.
function parseColor(c){
  if(Array.isArray(c))return c;
  if(typeof c==='string'){
    if(c[0]==='#'){let h=c.slice(1);if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];const n=parseInt(h,16);if(h.length===6&&!isNaN(n))return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
    const p=own('pigment',c)||own('pigment',c.toLowerCase())||PIGMENTS[c.toLowerCase()];if(p)return parseColor(p)}
  else if(c&&typeof c==='object'){
    if(c.mix)return mixColors(c.mix);
    if(c.color){const b=parseColor(c.color);return[b[0],b[1],b[2],c.scatter===undefined?b[3]:c.scatter,c.strength===undefined?b[4]:c.strength]}}
  throw new Error('PaintSim: unknown colour '+JSON.stringify(c))}

function resolveIn(reg,kind,v,depth,skip){
  if(typeof v==='string'){const lo=v===skip?undefined:own(kind,v),r=lo!==undefined?lo:reg[v];if(!r)throw new Error('PaintSim: unknown '+kind+' "'+v+'"');
    return resolveIn(reg,kind,r,depth,lo!==undefined?v:undefined)}   // a recipe of a painting's own may build on the shared recipe of the same name
  if(v&&v.base!==undefined){if((depth|0)>12)throw new Error('PaintSim: '+kind+' "base" chain is too deep');
    const b=resolveIn(reg,kind,v.base,(depth|0)+1,skip),o=Object.assign({},b,v);delete o.base;
    if(v.addTexture){o.texture=(b.texture||[]).concat(v.addTexture);delete o.addTexture}
    if(reg===MATERIALS&&v.color!==undefined&&v.color2===undefined)delete o.color2;   // a new colour on its own means one tone, not the parent's second tone
    return o}
  return v||{}}
const material=m=>resolveIn(MATERIALS,'material',m),brushOf=b=>resolveIn(BRUSHES,'brush',b),groundOf=g=>resolveIn(GROUNDS,'ground',g);
// the bare minimum, so the engine works on its own; paintsim.recipes.js brings the real palette
MATERIALS.gouache={family:'water',color:'#b8442c',opacity:.94,body:.5,ridges:.12,grain:.03,level:.35,gloss:.05,sharp:.2,dry:.3,reach:220};
BRUSHES.round={shape:'round',width:14,profile:'leaf',clump:3,streak:1,wobble:.3,var:.1};
GROUNDS.vellum={kind:'vellum',color:'#ecdfbf',tooth:.13};

/* ====================================================================== pigment mixing
   Paint does not average the way light does. Every colour is given a reflectance curve over 16 bands of the spectrum
   (the smoothest curves that give back exactly the same sRGB colour, after Scott Burns); pigments are then mixed by
   adding up their absorption K and their scattering S (Kubelka–Munk), and the mixture is turned back into a colour.
   So blue and yellow make green, a little white goes a long way, and complements make a dark neutral.
   Scattering is taken as one number per paint. The tables are printed by tools/spectral.mjs.                       */
const NB=16,F64=a=>Float64Array.from(a),
  RHO_R=F64([0.05692,0.05668,0.03016,0,0,0,0,0,0,0.10839,0.87021,1,1,1,1,1]),
  RHO_G=F64([0,0,0,0.01325,0.30207,0.68639,0.97644,1,1,0.83179,0.12979,0,0,0,0,0]),
  RHO_B=RHO_R.map((r,i)=>1-r-RHO_G[i]),
  MIX_R=F64([0.00234,0.02389,0.04663,-0.00035,-0.06135,-0.12889,-0.17642,-0.10552,0.08367,0.29714,0.4157,0.34995,0.18107,0.05885,0.01188,0.00141]),
  MIX_G=F64([-0.00193,-0.02073,-0.04526,-0.01896,0.0417,0.13029,0.25073,0.29541,0.24109,0.13569,0.03112,-0.01824,-0.01628,-0.0047,-0.00017,0.00025]),
  MIX_B=F64([0.01601,0.15103,0.36751,0.35386,0.17701,0.04743,-0.00879,-0.03032,-0.03112,-0.02294,-0.01233,-0.00482,-0.00164,-0.00061,-0.00022,-0.00006]);
const S2L=new Float64Array(1026),L2S=new Float64Array(4098);

      do             a group of steps; `with` gives them shared fields; a top-level step is a stage, named by `name`

    PaintSim.check(painting)                  → a list of problems (empty when it is sound)
    PaintSim.open(painting, {canvas, scale})  → a player: next(), run(n), runFor(ms), finish(); .surface .stages .at .total

    if(depth>8)throw new Error('shape "'+spec+'" refers to itself');return shapePolys(shapes[spec],shapes,depth+1)}
  if(Array.isArray(spec)){if(!spec.length)throw new Error('an empty shape');
    if(isPt(spec[0])){if(spec.length<3)throw new Error('a polygon needs at least 3 points');const bad=spec.findIndex(p=>!isPt(p));if(bad>=0)throw new Error('point '+(bad+1)+' of the polygon is not [x, y]');return[spec]}
    return[].concat(...spec.map(q=>shapePolys(q,shapes,depth+1)))}
  if(isObj(spec)){const ks=Object.keys(spec),v=spec[ks[0]],nums=n=>Array.isArray(v)&&v.length>=n&&v.every(num);
    if(ks.length!==1)throw new Error('a shape object has exactly one of: rect, circle, ellipse, curve, polygon');
    switch(ks[0]){
      case'rect':if(!nums(4))throw new Error('rect is [x0, y0, x1, y1]');return[P.util.rect(v[0],v[1],v[2],v[3])];
      case'circle':case'ellipse':{const el=ks[0]==='ellipse';if(!nums(el?4:3))throw new Error(el?'ellipse is [cx, cy, rx, ry] or [cx, cy, rx, ry, degrees]':'circle is [cx, cy, r]');
        const rx=v[2],ry=el?v[3]:v[2],rot=(el&&v[4]||0)*Math.PI/180,n=Math.max(24,Math.min(240,Math.ceil(2*Math.PI*Math.max(rx,ry)/1.2))),ca=Math.cos(rot),sa=Math.sin(rot),o=[];
        if(!(rx>0&&ry>0))throw new Error('a radius must be more than 0');
        for(let i=0;i<n;i++){const t=i/n*2*Math.PI,x=Math.cos(t)*rx,y=Math.sin(t)*ry;o.push([v[0]+x*ca-y*sa,v[1]+x*sa+y*ca])}return[o]}
      case'curve':if(!Array.isArray(v)||v.length<3||!v.every(isPt))throw new Error('curve is a list of at least 3 points; the outline runs smoothly through them and closes');return[P.util.spline(v,10,true)];
      case'polygon':return shapePolys(v,shapes,depth+1);
      default:throw new Error('unknown kind of shape "'+ks[0]+'"'+near(ks[0],['rect','circle','ellipse','curve','polygon']))}}
  throw new Error('a shape is a list of points, a name, or {rect} {circle} {ellipse} {curve}')}

function kindOf(st){let kind=null;for(const k of Object.keys(KEY))if(KEY[k].some(q=>has(st,q))){if(kind)return null;kind=k}return kind}

/* ---------- check: everything that can be wrong with a painting, said where it is ---------- */
function check(doc){const out=[],add=(at,m)=>out.push(at?at+': '+m:m);
  if(!isObj(doc))return['a painting is an object: {"paintsim": 1, "size": [width, height], "steps": [ … ]}'];
  for(const k of Object.keys(doc))if(!TOP.includes(k))add('',unknownKey(k,TOP));
  if(doc.paintsim!==FORMAT)add('paintsim',doc.paintsim===undefined?'missing: say "paintsim": '+FORMAT+' (the version of this format)':'this reader understands format '+FORMAT+', not '+JSON.stringify(doc.paintsim));
  if(!(Array.isArray(doc.size)&&doc.size.length===2&&doc.size.every(v=>num(v)&&v>=8&&v<=20000)))add('size','must be [width, height] in page units (each 8 to 20000)');
  if(doc.seed!==undefined&&!num(doc.seed))add('seed','must be a number');
  const defs=doc.define;
  if(defs!==undefined&&!isObj(defs)){add('define','must be an object with any of: '+Object.keys(DEFINE).join(', '));return out}
  for(const k of Object.keys(defs||{})){if(!DEFINE[k])add('define',unknownKey(k,Object.keys(DEFINE)));else if(!isObj(defs[k]))add('define.'+k,'must be an object of name: recipe')}
  const names=kind=>Object.keys(P[kind==='brush'?'brushes':kind+'s']).concat(Object.keys(isObj(defs)&&isObj(defs[kind==='brush'?'brushes':kind+'s'])?defs[kind==='brush'?'brushes':kind+'s']:{}));
  const recipe=(at,kind,v)=>{if(typeof v!=='string'&&!isObj(v)&&!(kind==='pigment'&&Array.isArray(v)))return add(at,'must be a name or a recipe');
    for(const m of P.lint(kind,v)){const u=/^unknown (material|brush|ground|light|pigment) "(.*)"$/.exec(m);add(at,u?m+near(u[2],names(u[1])):m)}};
  const colour=(at,v)=>{try{P.color(v)}catch(e){add(at,String(e.message).replace('PaintSim: ',''))}};
  const fields=(at,o)=>{for(const k of Object.keys(o)){const v=o[k],w=at+'.'+k;if(v===null||v===undefined)continue;
    if(k==='material'||k==='brush')recipe(w,k,v);
    else if(k==='color'||k==='color2')colour(w,v);
    else if(k==='pressure'){if(!(typeof v==='string'?has(P.profiles,v):Array.isArray(v)&&v.length>=2&&v.every(num)))add(w,typeof v==='string'?'unknown pressure profile "'+v+'"'+near(v,Object.keys(P.profiles)):'must be a profile name or a list of numbers')}
    else if(k==='clip'){try{shapePolys(v,doc.shapes)}catch(e){add(w,e.message)}}
    else if(NUMBERS.includes(k)){if(!num(v))add(w,'must be a number')}
    else if(k==='spline'){if(typeof v!=='boolean')add(w,'must be true or false')}
    else if(k==='opts'||k==='cushion'){if(!isObj(v))add(w,'must be an object')}}};
  const walk=(list,at,w)=>{if(!Array.isArray(list))return add(at,'must be a list of steps');
    list.forEach((st,i)=>{const a=at+'['+i+']';if(!isObj(st))return add(a,'a step is an object');
      const kind=kindOf(st),present=[].concat(...Object.values(KEY)).filter(k=>has(st,k));
      if(!kind)return add(a,present.length?'has '+present.join(' and ')+': a step does one thing':'a step needs one of: path, paths, shape, at, dots, flow, dry, do');
      const ok=KEY[kind].concat(F[kind],COMMON);for(const k of Object.keys(st))if(!ok.includes(k))add(a,unknownKey(k,ok)+(WITH.includes(k)?' — a '+kind+' step does not take it':''));
      if(st.name!==undefined&&typeof st.name!=='string')add(a+'.name','must be text');
      if(st.seed!==undefined&&!num(st.seed))add(a+'.seed','must be a number');
      const own={};for(const k of F[kind])if(has(st,k)&&k!=='with')own[k]=st[k];fields(a,own);
      const eff=k=>st[k]!==undefined&&st[k]!==null?st[k]:w[k];
      if(kind==='group'){if(st.with!==undefined){if(!isObj(st.with))return add(a+'.with','must be an object of shared fields');
          for(const k of Object.keys(st.with))if(!WITH.includes(k))add(a+'.with',unknownKey(k,WITH));fields(a+'.with',st.with)}
        walk(st.do,a+'.do',Object.assign({},w,st.with))}
      else if(kind==='stroke'){if(has(st,'path')&&has(st,'paths'))add(a,'has path and paths: use one');
        let min=2;try{if(P.brush(eff('brush')||'round').kind==='spray')min=1}catch(e){}
        const one=(p,b)=>{if(!Array.isArray(p)||p.length<min)return add(b,'a path is a list of at least '+min+' point'+(min>1?'s':'')+' [x, y]');const bad=p.findIndex(q=>!isPt(q));if(bad>=0)add(b,'point '+(bad+1)+' is not [x, y]')};
        if(has(st,'path'))one(st.path,a+'.path');else if(!Array.isArray(st.paths)||!st.paths.length)add(a+'.paths','must be a list of paths');else st.paths.forEach((p,j)=>one(p,a+'.paths['+j+']'))}
      else if(kind==='fill'){try{shapePolys(st.shape,doc.shapes)}catch(e){add(a+'.shape',e.message)}}
      else if(kind==='dot'){if(has(st,'at')&&has(st,'dots'))add(a,'has at and dots: use one');const r=eff('r');
        if(has(st,'at')){if(!isPt(st.at))add(a+'.at','must be [x, y]');if(!(num(r)&&r>0))add(a,'a dot needs r, its radius')}
        else if(!Array.isArray(st.dots)||!st.dots.length)add(a+'.dots','must be a list of [x, y] or [x, y, r]');
        else st.dots.forEach((d,j)=>{if(!isPt(d))add(a+'.dots['+j+']','must be [x, y] or [x, y, r]');else if(!(num(d[2])?d[2]>0:num(r)&&r>0))add(a+'.dots['+j+']','has no radius: give [x, y, r] or an r for the step')})}
      else if(kind==='flow'){if(!(num(st.flow)&&st.flow>=0))add(a+'.flow','must be a number: 1 is about the time a wet sheet takes to dry')}
      else if(kind==='dry'){if(!(st.dry===true||st.dry==='still'||(num(st.dry)&&st.dry>=0&&st.dry<=1)))add(a+'.dry','must be true, "still" (at once, nothing moves) or an amount from 0 to 1')}})};
  P.within(isObj(defs)?defs:null,()=>{
    for(const k of Object.keys(defs||{}))if(DEFINE[k]&&isObj(defs[k]))for(const n of Object.keys(defs[k]))recipe('define.'+k+'["'+n+'"]',DEFINE[k],defs[k][n]);
    if(doc.ground!==undefined)recipe('ground','ground',doc.ground);
    if(doc.light!==undefined)recipe('light','light',doc.light);
    if(doc.shapes!==undefined){if(!isObj(doc.shapes))add('shapes','must be an object of name: shape');else for(const n of Object.keys(doc.shapes)){try{shapePolys(n,doc.shapes)}catch(e){add('shapes["'+n+'"]',e.message)}}}
    if(doc.steps===undefined)add('steps','missing: the list of what is painted, in order');else walk(doc.steps,'steps',{})});
  return out}

/* ---------- open: a painting ready to be painted, one step at a time ---------- */
function open(doc,opts){opts=opts||{};
  if(!opts.unchecked){const pr=check(doc);if(pr.length)throw new Error('PaintSim: this painting has '+pr.length+' problem'+(pr.length>1?'s':'')+':\n  - '+pr.slice(0,12).join('\n  - ')+(pr.length>12?'\n  - … and '+(pr.length-12)+' more':''))}
  const seed0=(doc.seed===undefined?1:doc.seed)|0,shapes=doc.shapes||{},masks=new Map(),ops=[],stages=[];
  const surface=P.create({canvas:opts.canvas,width:doc.size[0],height:doc.size[1],scale:opts.scale||2,ground:doc.ground||'vellum',light:opts.light||doc.light,seed:seed0,define:doc.define});
  // lay the nested steps out flat, each with its shared fields filled in. Every stage starts from its own random seed,
  // so that changing one stage does not disturb the accidents of the others.
  let pending=null;const push=op=>{if(pending!==null){op.seed=pending;pending=null}ops.push(op)};
  const pick=(w,st,list)=>{const o={};for(const k of list){const v=st[k]!==undefined?st[k]:w[k];if(v!==undefined&&v!==null)o[k]=v}return o};
  const flat=(list,at,w,top)=>list.forEach((st,i)=>{if(st.hide)return;const a=at+'['+i+']',from=ops.length,kind=kindOf(st);
    if(st.seed!==undefined)pending=st.seed|0;else if(top)pending=(Math.imul(seed0,7919)+Math.imul(i+1,104729))|0;
    if(kind==='group')flat(st.do,a+'.do',Object.assign({},w,st.with),false);
    else if(kind==='stroke'){const cmd=pick(w,st,F.stroke);for(const p of st.paths||[st.path])push({k:'paint',cmd,path:p,at:a})}
    else if(kind==='fill')push({k:'fill',cmd:pick(w,st,F.fill),shape:st.shape,at:a});
    else if(kind==='dot'){const cmd=pick(w,st,F.dot);for(const d of st.dots||[st.at])push({k:'dot',cmd,d,at:a})}
    else push({k:kind,v:st[kind],at:a});
    if(top)stages.push({name:st.name||kind+' '+(i+1),from,to:ops.length})});
  flat(doc.steps,'steps',{},true);
  if(opts.upTo!==undefined){const i=typeof opts.upTo==='number'?opts.upTo:stages.findIndex(s=>s.name===opts.upTo);if(!stages[i])throw new Error('PaintSim: no stage '+JSON.stringify(opts.upTo)+' in this painting');ops.length=stages[i].to;stages.length=i+1}
  const maskOf=spec=>{const key=typeof spec==='string'?'#'+spec:JSON.stringify(spec);let m=masks.get(key);if(m===undefined){m=surface.polyMask(shapePolys(spec,shapes));masks.set(key,m)}return m};
  function exec(op){if(op.seed!==undefined)surface.reseed(op.seed);
    switch(op.k){
      case'paint':{const c=Object.assign({},op.cmd,{path:op.path});if(c.clip!==undefined)c.clip=maskOf(c.clip);surface.paint(c);break}
      case'fill':{const c=Object.assign({},op.cmd,{shape:shapePolys(op.shape,shapes)});if(c.clip!==undefined)c.clip=maskOf(c.clip);surface.fill(c);break}
      case'dot':surface.dot(Object.assign({},op.cmd,{at:[op.d[0],op.d[1]],r:op.d[2]===undefined?op.cmd.r:op.d[2]}));break;
      case'flow':surface.flow(op.v);break;
      case'dry':if(op.v==='still')surface.dry(1,true);else surface.dry(op.v===true?1:op.v);break}}
  const now=()=>typeof performance!=='undefined'?performance.now():Date.now();
  const player={surface,painting:doc,stages,total:ops.length,at:0,
    get done(){return player.at>=ops.length},
    get stage(){const i=stages.findIndex(s=>player.at<s.to);return i<0?stages.length-1:i},
    // one step. After the last one the picture is left to dry, because a painting is photographed dry
    next(){if(player.at>=ops.length)return false;const op=ops[player.at];
      try{exec(op)}catch(e){e.message='PaintSim: '+op.at+': '+String(e.message).replace(/^PaintSim: /,'');throw e}
      if(++player.at>=ops.length){surface.dry();return false}return true},
    run(n){for(let i=0;i<n&&player.next();i++);return!player.done},
    runFor(ms){const t=now()+ms;while(player.next()&&now()<t);return!player.done},
    finish(){while(player.next());return surface}};
  return player}

function render(doc,opts){const s=open(doc,opts).finish();s.render();return s}

P.FORMAT=FORMAT;P.check=check;P.open=open;P.render=render;P.shape=(spec,shapes)=>shapePolys(spec,shapes||{});
})(PaintSim);

</script>
<script>
(()=>{
'use strict';
const P=PaintSim,$=s=>document.querySelector(s),cv=$('#cv');
const tick=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0)});   // not slowed down in a background tab
const status=t=>{$('#status').textContent=t};
let doc=null,player=null,token=0;

const lsel=$('#light');for(const n of['(as painted)'].concat(Object.keys(P.lights))){const o=document.createElement('option');o.textContent=n;lsel.appendChild(o)}
const lightOf=()=>lsel.value==='(as painted)'?undefined:lsel.value;

function problems(list){const el=$('#problems');el.hidden=!list.length;el.textContent=list.length?list.length+' problem'+(list.length>1?'s':'')+' in this painting\n  - '+list.join('\n  - '):''}
function stages(){const box=$('#stages');box.textContent='';player.stages.forEach((s,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=s.name;b.title='Show the painting as it stood after this stage';b.onclick=()=>play({instant:true,upTo:i});box.appendChild(b)})}
function mark(){const cur=player.done?-1:player.stage;[...$('#stages').children].forEach((b,i)=>{b.classList.toggle('on',i===cur);b.classList.toggle('past',cur>=0&&i<cur)})}

// paint the current painting: watched (about six seconds for the whole of it) or at once
async function play(o){o=o||{};const my=++token;if(!doc)return;
  const pr=P.check(doc);problems(pr);if(pr.length){status('not painted');return}
  try{player=P.open(doc,{canvas:cv,scale:+$('#scale').value,light:lightOf(),upTo:o.upTo,unchecked:true})}catch(e){problems([e.message]);return}
  $('#title').textContent=doc.title||'Untitled';$('#note').textContent=doc.note||'';document.title=(doc.title||'Untitled')+' — PaintSim';
  if(o.upTo===undefined)stages();player.surface.render();const t0=performance.now(),want=o.instant?0:Math.min(6000,400+player.total*40);
  try{while(!player.done){if(my!==token)return;
      if(want){const due=Math.ceil((performance.now()-t0)/want*player.total);while(player.at<due&&player.next());}else player.runFor(40);
      player.surface.flush();mark();status('step '+player.at+' of '+player.total);await tick()}}
  catch(e){problems([e.message]);status('stopped');return}
  if(my!==token)return;player.surface.render();mark();
  status(player.total+' steps · '+cv.width+'×'+cv.height+' · '+((performance.now()-t0)/1000).toFixed(1)+' s'+(o.upTo!==undefined?' · after “'+player.stages[player.stages.length-1].name+'”':''))}

function load(text,from){let d;try{d=JSON.parse(text)}catch(e){problems(['not valid JSON: '+e.message]);status(from||'');return}
  doc=d;$('#json').value=text;play()}

$('#again').onclick=()=>play();
$('#skip').onclick=()=>play({instant:true});
$('#scale').onchange=()=>play({instant:true});
lsel.onchange=()=>{if(player&&player.done)player.surface.light(lightOf()||doc.light||'raking').render();else play({instant:true})};
$('#apply').onclick=()=>load($('#json').value,'edited');
$('#save').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=((doc&&doc.title)||'painting').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},'image/png');
$('#open').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>load(t,f.name))};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',()=>document.body.classList.remove('drop'));
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');const f=e.dataTransfer.files[0];if(f)f.text().then(t=>load(t,f.name))});

// which painting: ?doc=some.json, or the one built into a standalone copy of this page, or the sample
const want=new URLSearchParams(location.search).get('doc'),built=document.getElementById('built-in');
if(!want&&built)load(built.textContent,'built in');
else{const url=want||'paintings/hills.json';status('loading '+url+'…');fetch(url).then(r=>{if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.text()}).then(t=>load(t,url),e=>{problems(['could not load '+url+': '+e.message]);status('')})}
window.PaintPlayer={get player(){return player},get painting(){return doc},play,load};
})();
</script>
