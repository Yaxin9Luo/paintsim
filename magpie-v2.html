<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magpie Marginalia</title>
<style>
  html,body{margin:0;height:100%;background:#191715;color:#cfc4ae;font:13px/1.4 Georgia,'Times New Roman',serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{width:min(calc(100vh - 70px),94vw,1100px);aspect-ratio:1;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#e6d8b8}
  .bar{display:flex;gap:10px;align-items:center}
  button{font:inherit;color:#e8dcc2;background:#2c2823;border:1px solid #4a4237;border-radius:4px;padding:5px 12px;cursor:pointer}
  button:hover{background:#3a342c}
  #st{min-width:230px;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="replay">Repaint</button>
  <button id="skip">Skip to finished</button>
  <button id="save">Save PNG</button>
  <span id="st"></span>
</div>
<script>
(()=>{
'use strict';
/* =====================================================================
   A small physical paint simulator.
   Every brush stroke is a bundle of individual bristles. Each bristle
   carries its own colour and paint load, deposits pigment AND thickness,
   runs dry on the tooth of the vellum, and can pick up wet colour beneath
   it. The finished relief is then photographed under a raking light, so
   ridges of paint, raised gold leaf and metallic flakes catch the light.
   Nothing here is traced from an image: the picture is built stroke by
   stroke from geometry written below.
   ===================================================================== */
const qs=new URLSearchParams(location.search);
const W=Math.max(256,Math.min(4096,(+qs.get('res')||(navigator.deviceMemory&&navigator.deviceMemory<4?1400:2048))|0)),H=W,S=W/1000,N=W*H,HS=S/2.048;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d'),st=document.getElementById('st');

/* ---------- random + noise ---------- */
let seed=1;
function rnd(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const R=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)];
function hash(x,y){let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);a*=.5;f*=2}return s/(1-Math.pow(.5,o))}
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=Math.floor(h),f=h-i,p=v*(1-s),qq=v*(1-s*f),t=v*(1-s*(1-f));
  return i===0?[v,t,p]:i===1?[qq,v,p]:i===2?[p,v,t]:i===3?[p,qq,v]:i===4?[t,p,v]:[v,p,qq]}

/* ---------- the painting surface ---------- */
const F=()=>new Float32Array(N);
const CR=F(),CG=F(),CB=F();      // pigment colour
const HT=F();                    // paint thickness (relief)
const SP=F(),MT=F(),IR=F(),IH=F(); // gloss, gold-leaf, iridescent flake amount + hue
const PAPER=F(),HB=F();          // tooth of the vellum, working height buffer
const sW=F(),sR=F(),sG=F(),sBl=F(),sL=F(),sH=F(),sU=F(); // scratch layer for the stroke being painted
const touched=new Int32Array(N);
const OUT=new ImageData(W,H);
const TS=64,TW=Math.ceil(W/TS),dirty=new Uint8Array(TW*TW);
function markDirty(x0,y0,x1,y1){if(x1<0||y1<0||x0>=W||y0>=H)return;
  const a=Math.max(0,(x0-12)/TS|0),b=Math.max(0,(y0-12)/TS|0),c=Math.min(TW-1,(x1+12)/TS|0),d=Math.min(TW-1,(y1+12)/TS|0);
  for(let j=b;j<=d;j++)for(let i=a;i<=c;i++)dirty[j*TW+i]=1}

/* ---------- op queue ---------- */
let Q=[],stageName='';const q=f=>Q.push(f),stage=n=>q(()=>{stageName=n});
function batch(items,per,fn){for(let i=0;i<items.length;i+=per){const sl=items.slice(i,i+per);q(()=>{for(const it of sl)fn(it)})}}

/* ---------- geometry ---------- */
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)}
function spline(p,seg=10,closed=false){const n=p.length,o=[];const g=i=>closed?p[(i+n)%n]:p[clamp(i,0,n-1)];const m=closed?n:n-1;
  for(let i=0;i<m;i++){const a=g(i-1),b=g(i),c=g(i+1),d=g(i+2);for(let j=0;j<seg;j++){const t=j/seg;o.push([cr(a[0],b[0],c[0],d[0],t),cr(a[1],b[1],c[1],d[1],t)])}}
  if(!closed)o.push(p[n-1].slice());return o}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const a of p){if(a[0]<x0)x0=a[0];if(a[1]<y0)y0=a[1];if(a[0]>x1)x1=a[0];if(a[1]>y1)y1=a[1]}return{x0,y0,x1,y1,w:x1-x0,h:y1-y0}}
function arc(x,y,ang,len,curv=0,n=6){const p=[[x,y]];let a=ang-curv/2;const s=len/n;for(let i=0;i<n;i++){a+=curv/n;x+=Math.cos(a)*s;y+=Math.sin(a)*s;p.push([x,y])}return p}
function circleArc(cx,cy,r,a0,a1,n=16){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
function tipArc(sx,sy,ang,len,wid,t0,t1){const ca=Math.cos(ang),sa=Math.sin(ang),cx=sx+ca*len*.66,cy=sy+sa*len*.66,ra=len*.34,rb=wid*.5,p=[];
  for(let i=0;i<=10;i++){const th=t0+(t1-t0)*i/10,a=ra*Math.cos(th),b=rb*Math.sin(th);p.push([cx+ca*a-sa*b,cy+sa*a+ca*b])}return p}
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
function blob(cx,cy,r,n=11,irr=.3){const p=[];for(let i=0;i<n;i++){const a=i/n*6.283,rr=r*(1+R(-irr,irr));p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}return spline(p,5,true)}
function local(pts,x,y,ang,s){const c=Math.cos(ang),n=Math.sin(ang);return pts.map(p=>[x+(p[0]*c-p[1]*n)*s,y+(p[0]*n+p[1]*c)*s])}
function tendril(x,y,ang,len,k0,k1){const p=[[x,y]],s=4;for(let d=0;d<len;d+=s){const t=d/len;ang+=(k0+(k1-k0)*t*t)*s;x+=Math.cos(ang)*s;y+=Math.sin(ang)*s;p.push([x,y])}return p}
function distPoly(x,y,P){let d=1e18;for(let i=0;i<P.length-1;i++){const ax=P[i][0],ay=P[i][1],vx=P[i+1][0]-ax,vy=P[i+1][1]-ay,t=clamp(((x-ax)*vx+(y-ay)*vy)/(vx*vx+vy*vy),0,1),dx=x-ax-vx*t,dy=y-ay-vy*t,dd=dx*dx+dy*dy;if(dd<d)d=dd}return Math.sqrt(d)}
const hctx=document.createElement('canvas').getContext('2d');
const toPath=poly=>{const h=new Path2D();poly.forEach((p,i)=>i?h.lineTo(p[0],p[1]):h.moveTo(p[0],p[1]));h.closePath();return h};
function sampleIn(poly,n){const path=toPath(poly),b=bbox(poly),out=[];let guard=0;
  while(out.length<n&&guard++<n*80){const x=R(b.x0,b.x1),y=R(b.y0,b.y1);if(hctx.isPointInPath(path,x,y))out.push([x,y])}return out}
// blue-noise scatter with a radius that varies over the shape (small feathers on the face, large on the body)
function poisson(poly,rf,rmin,rmax){const path=toPath(poly),b=bbox(poly),cell=rmax,grid=new Map(),out=[],M=Math.ceil(b.w*b.h/(rmin*rmin)*9);
  for(let i=0;i<M;i++){const x=R(b.x0,b.x1),y=R(b.y0,b.y1);if(!hctx.isPointInPath(path,x,y))continue;const r=rf(x,y),gx=Math.floor(x/cell),gy=Math.floor(y/cell);let ok=true;
    for(let a=gx-1;a<=gx+1&&ok;a++)for(let c=gy-1;c<=gy+1&&ok;c++){const g=grid.get(a*8192+c);if(g)for(const p of g){const dx=p[0]-x,dy=p[1]-y;if(dx*dx+dy*dy<r*r){ok=false;break}}}
    if(ok){out.push([x,y]);const key=gx*8192+gy;let g=grid.get(key);if(!g){g=[];grid.set(key,g)}g.push([x,y])}}
  return out}

/* =====================================================================
   BRISTLE BRUSH
   ===================================================================== */
const STEP=.75,MAXP=30000,rx=new Float32Array(MAXP),ry=new Float32Array(MAXP),rnx=new Float32Array(MAXP),rny=new Float32Array(MAXP);
const MAXB=700,bu=new Float32Array(MAXB),bR=new Float32Array(MAXB),bG=new Float32Array(MAXB),bBl=new Float32Array(MAXB),bL=new Float32Array(MAXB),bH=new Float32Array(MAXB),bS=new Float32Array(MAXB),bE=new Float32Array(MAXB),bPh=new Int32Array(MAXB);
const NTAB=new Float32Array(1024);for(let i=0;i<1024;i++)NTAB[i]=vnoise(i/26,3.7);
// pressure curves: how hard the brush is pressed along the stroke (0 start → 1 end)
const PROF={
  leaf:t=>Math.pow(Math.sin(Math.PI*Math.pow(t,1.25)),.75),
  feather:t=>Math.pow(Math.sin(Math.PI*Math.min(1,Math.pow(t,1.5))),.5),
  taper:t=>Math.pow(Math.sin(Math.PI*t),.55),
  comma:t=>smooth(t/.08)*Math.pow(1-t,.75),
  hair:t=>smooth(t/.06)*Math.pow(1-t,.8),
  flat:t=>smooth(t/.04)*smooth((1-t)/.04),
  pen:t=>smooth(t/.05)*smooth((1-t)/.1)*(.8+.2*Math.sin(Math.PI*t))
};
function resampleInto(P){let n=1,px=P[0][0]*S-.5,py=P[0][1]*S-.5,need=STEP;rx[0]=px;ry[0]=py;
  for(let i=1;i<P.length&&n<MAXP;i++){const bx=P[i][0]*S-.5,by=P[i][1]*S-.5;let ax=px,ay=py,seg=Math.hypot(bx-ax,by-ay);
    while(seg>=need&&n<MAXP){const f=need/seg;ax+=(bx-ax)*f;ay+=(by-ay)*f;rx[n]=ax;ry[n]=ay;n++;seg-=need;need=STEP}
    need-=seg;px=bx;py=by}
  for(let j=0;j<n;j++){const a=j>2?j-3:0,b=j<n-3?j+3:n-1,dx=rx[b]-rx[a],dy=ry[b]-ry[a],l=Math.hypot(dx,dy)||1;rnx[j]=-dy/l;rny[j]=dx/l}
  return n}
/* stroke(points, options) — units are page units (the page is 1000 wide)
   w width · col/col2 the one or two colours loaded on the brush · grad/gradN how the two are spread across the bristles
   prof pressure curve · flat: flat brush (constant width) · a opacity · thick relief · dry dry-brush breakup on the vellum tooth
   load distance the paint lasts · pick wet pick-up of the colour beneath · mode 'glaze' = transparent wash
   spec gloss · metal gold · irid/hue metallic flake · clip mask · tone2 lighten/darken toward the tip */
function stroke(P,o){
  if(!P||P.length<2)return;
  let src=P;if(o.spline!==false&&P.length>2&&P.length<40)src=spline(P,o.seg||8);
  const n=resampleInto(src);if(n<2)return;
  const w=Math.max(.7,o.w*S),len=(n-1)*STEP,prof=typeof o.prof==='function'?o.prof:PROF[o.prof||'taper'],flat=!!o.flat,press=o.press??1;
  const nb=Math.min(MAXB,Math.max(1,Math.round(w)));
  const c1=o.col,c2=o.col2||c1,two=!!o.col2,jit=o.jit??.05,streak=o.streak??.1,grad=o.grad??0,gradN=o.gradN??.5;
  const thick=o.thick??.5,edge=o.edge??0,taperH=o.taperH??.72,vary=o.vary??.1,wet=o.wet??1.15,invLoad=o.load?1/(o.load*S):0,pick=o.pick??0,rag=(o.rag??0)*S;
  const cfreq=Math.max(1.2,w/((o.clump??3)*S)),su=rnd()*999,sv=rnd()*999,varA=o.var??0,wob=(o.wob??0)*S,tone2=o.tone2??0;
  const ffreq=w/3.3,sf2=rnd()*999,kkn=26/((o.varLen??9)*S);
  for(let i=0;i<nb;i++){const u=nb>1?((i+.5+(rnd()-.5)*.3)/nb)*2-1:0,uu=u*.5+.5,cl=vnoise(su+uu*cfreq,7.7),fn=vnoise(sf2+uu*ffreq,2.2),tone=1+(cl-.5)*2*streak+(fn-.5)*2*jit;
    const m=two?clamp(.5+.5*u*grad+(cl-.5)*2*gradN,0,1):0,au=u<0?-u:u;
    bu[i]=u;bR[i]=(c1[0]+(c2[0]-c1[0])*m)*tone;bG[i]=(c1[1]+(c2[1]-c1[1])*m)*tone;bBl[i]=(c1[2]+(c2[2]-c1[2])*m)*tone;
    bL[i]=wet*(.72+.56*cl)*(.85+.3*rnd());
    bH[i]=thick*(.45+1.1*cl+(fn-.5)*.4)*(1-taperH*smooth((au-.5)/.5))+edge*thick*Math.exp(-Math.pow((au-.78)/.12,2));
    bPh[i]=(vnoise(sf2+uu*cfreq*.8,5.1)*900)|0;
    bS[i]=rag*rnd();bE[i]=len-rag*rnd()}
  let x0=1e9,y0=1e9,x1=-1,y1=-1,nT=0;
  for(let j=0;j<n;j++){const t=j/(n-1);let p=prof(t)*press;if(varA)p*=1+varA*(vnoise(su+j*STEP/(9*S),3.3)-.5)*2;if(!(p>.012))continue;if(p>1)p=1;
    const dist=j*STEP,hw=flat?w*.5:Math.max(.3,w*.5*p),pa=flat?p:(p*4>1?1:p*4),dl=dist*invLoad,tt=tone2?1+tone2*(t-.35):1;
    const di=(dist*kkn)|0,hp=.35+.65*p;
    let cx=rx[j],cy=ry[j];const nx=rnx[j],ny=rny[j];
    if(wob){const wv=(vnoise(sv+dist/(14*S),8.1)-.5)*2*wob;cx+=nx*wv;cy+=ny*wv}
    for(let i=0;i<nb;i++){if(dist<bS[i]||dist>bE[i])continue;let L=bL[i]-dl;if(L<=0)continue;if(L>1)L=1;
      const u=bu[i],x=cx+nx*u*hw,y=cy+ny*u*hw;if(x<0||y<0)continue;const ix=x|0,iy=y|0;if(ix>=W-1||iy>=H-1)continue;
      const k=iy*W+ix;
      if(pick>0){bR[i]+=(CR[k]-bR[i])*pick;bG[i]+=(CG[k]-bG[i])*pick;bBl[i]+=(CB[k]-bBl[i])*pick}
      const md=NTAB[(di+bPh[i])&1023],tv=tt*(1+(md-.5)*2*vary),fx=x-ix,fy=y-iy,r=bR[i]*tv,g=bG[i]*tv,b=bBl[i]*tv,hh=bH[i]*(.5+.5*L)*hp*(.6+.8*md),au=u<0?-u:u;
      let wt=(1-fx)*(1-fy)*pa,kk=k;
      if(wt>0){if(sW[kk]===0)touched[nT++]=kk;sW[kk]+=wt;sR[kk]+=wt*r;sG[kk]+=wt*g;sBl[kk]+=wt*b;sL[kk]+=wt*L;sH[kk]+=wt*hh;sU[kk]+=wt*au}
      wt=fx*(1-fy)*pa;kk=k+1;
      if(wt>0){if(sW[kk]===0)touched[nT++]=kk;sW[kk]+=wt;sR[kk]+=wt*r;sG[kk]+=wt*g;sBl[kk]+=wt*b;sL[kk]+=wt*L;sH[kk]+=wt*hh;sU[kk]+=wt*au}
      wt=(1-fx)*fy*pa;kk=k+W;
      if(wt>0){if(sW[kk]===0)touched[nT++]=kk;sW[kk]+=wt;sR[kk]+=wt*r;sG[kk]+=wt*g;sBl[kk]+=wt*b;sL[kk]+=wt*L;sH[kk]+=wt*hh;sU[kk]+=wt*au}
      wt=fx*fy*pa;kk=k+W+1;
      if(wt>0){if(sW[kk]===0)touched[nT++]=kk;sW[kk]+=wt;sR[kk]+=wt*r;sG[kk]+=wt*g;sBl[kk]+=wt*b;sL[kk]+=wt*L;sH[kk]+=wt*hh;sU[kk]+=wt*au}
      if(ix<x0)x0=ix;if(ix>x1)x1=ix;if(iy<y0)y0=iy;if(iy>y1)y1=iy}}
  if(!nT)return;
  // lay the finished stroke onto the page in one go
  const A=o.a??1,dry=o.dry??.3,glaze=o.mode==='glaze',spec=o.spec??.1,metal=o.metal??0,irid=o.irid??0,hue=o.hue??0,rim=o.rim??.5,gran=o.gran??.3,clip=o.clip||null;
  for(let i=0;i<nT;i++){const k=touched[i],ws=sW[k],inv=1/ws,L=sL[k]*inv;let cov=ws*1.15;if(cov>1)cov=1;let a=cov*A;
    if(dry>0){const f=(L-(1-PAPER[k])*dry)*3.5;if(f<1)a=f<=0?0:a*f*f*(3-2*f)}else if(L<.25)a*=L*4;
    if(clip&&a>0){const x=k%W,y=(k-x)/W,mx=x-clip.x0,my=y-clip.y0;a*=(mx>=0&&my>=0&&mx<clip.w&&my<clip.h)?clip.a[my*clip.w+mx]:0}
    if(a>0){const r=sR[k]*inv,g=sG[k]*inv,b=sBl[k]*inv;
      if(glaze){const u=sU[k]*inv;let ga=a*(1+rim*smooth((u-.6)/.4)+gran*(.5-PAPER[k])*2);if(ga>1)ga=1;if(ga<0)ga=0;
        CR[k]*=1-ga*(1-r);CG[k]*=1-ga*(1-g);CB[k]*=1-ga*(1-b)}
      else{CR[k]+=(r-CR[k])*a;CG[k]+=(g-CG[k])*a;CB[k]+=(b-CB[k])*a;
        HT[k]=HT[k]*(1-.5*a)+a*sH[k]*inv;SP[k]+=(spec-SP[k])*a;MT[k]+=(metal-MT[k])*a;IR[k]+=(irid-IR[k])*a;if(irid>0&&a>.25)IH[k]=hue}}
    sW[k]=0;sR[k]=0;sG[k]=0;sBl[k]=0;sL[k]=0;sH[k]=0;sU[k]=0}
  markDirty(x0,y0,x1+1,y1+1)}

// a single round touch of paint (dots, the eye, a bead of ink)
function disc(xd,yd,rd,col,o={}){const x=xd*S-.5,y=yd*S-.5,r=rd*S,a0=o.a??1,soft=Math.max(.9,(o.soft??.12)*r),glaze=o.mode==='glaze',thick=o.thick??0;
  const x0=Math.max(0,Math.floor(x-r-2)),x1=Math.min(W-1,Math.ceil(x+r+2)),y0=Math.max(0,Math.floor(y-r-2)),y1=Math.min(H-1,Math.ceil(y+r+2));
  for(let py=y0;py<=y1;py++)for(let px=x0;px<=x1;px++){const d=Math.hypot(px-x,py-y);let a=(r-d)/soft+.5;if(a<=0)continue;if(a>1)a=1;a*=a0;const k=py*W+px;
    if(glaze){CR[k]*=1-a*(1-col[0]);CG[k]*=1-a*(1-col[1]);CB[k]*=1-a*(1-col[2])}
    else{CR[k]+=(col[0]-CR[k])*a;CG[k]+=(col[1]-CG[k])*a;CB[k]+=(col[2]-CB[k])*a;
      if(thick){const q2=d/r;HT[k]=HT[k]*(1-a)+a*(o.base??0)+a*thick*Math.sqrt(q2<1?1-q2*q2:0)}
      if(o.spec!==undefined)SP[k]+=(o.spec-SP[k])*a;MT[k]*=1-a;IR[k]*=1-a}}
  markDirty(x0,y0,x1,y1)}

/* ---------- soft masks for washes and gilding (shapes rasterised, then blurred) ---------- */
const MC=document.createElement('canvas'),mx2=MC.getContext('2d',{willReadFrequently:true});
function maskDraw(bb,draw,pad=3){const x0=Math.max(0,Math.floor(bb.x0*S-pad)),y0=Math.max(0,Math.floor(bb.y0*S-pad)),x1=Math.min(W,Math.ceil(bb.x1*S+pad)),y1=Math.min(H,Math.ceil(bb.y1*S+pad)),w=x1-x0,h=y1-y0;
  if(w<=0||h<=0)return null;MC.width=w;MC.height=h;mx2.setTransform(S,0,0,S,-x0,-y0);mx2.fillStyle='#fff';mx2.strokeStyle='#fff';draw(mx2);
  const d=mx2.getImageData(0,0,w,h).data,a=new Float32Array(w*h);for(let i=0,n=w*h;i<n;i++)a[i]=d[i*4+3]/255;return{x0,y0,w,h,a}}

/* ---------- runner ---------- */
let idx=0,raf=0,gen=0,fast=false,done=false;
const mc=new MessageChannel();let pump=null;mc.port1.onmessage=()=>{if(pump)pump()};
function finish(){relight(0,0,W-1,H-1);dirty.fill(0);if(!qs.has('raw'))photoFinish();done=true;st.textContent='finished';document.title='Magpie Marginalia ✓'}
function start(isFast){gen++;const g=gen;cancelAnimationFrame(raf);seed=20261111;Q=[];done=false;fast=!!isFast;document.title='Magpie Marginalia';
  CR.fill(.93);CG.fill(.873);CB.fill(.748);HT.fill(0);SP.fill(.03);MT.fill(0);IR.fill(0);PAPER.fill(.5);dirty.fill(0);ctx.fillStyle='#ecdfc0';ctx.fillRect(0,0,W,H);
  if(qs.has('test'))testScene();else compose();idx=0;
  const T0=performance.now(),TARGET=45000,due=()=>Math.ceil(Q.length*(performance.now()-T0)/TARGET)+1;
  // paced by the clock rather than by animation frames, so it keeps the same speed even where frames are throttled
  const step=()=>{if(g!==gen)return;const t0=performance.now();
    if(fast){while(idx<Q.length&&performance.now()-t0<70)Q[idx++]()}
    else{const allow=due();while(idx<Q.length&&idx<allow&&performance.now()-t0<18)Q[idx++]();flushDirty(90)}
    st.textContent=`${stageName} — ${Math.round(idx/Q.length*100)}%`;
    if(idx<Q.length){if(fast||idx<due())mc.port2.postMessage(0);else setTimeout(()=>{if(g===gen&&!fast)step()},24)}
    else{finish();console.log('painted in',Math.round(performance.now()-T0),'ms,',Q.length,'ops')}};
  pump=step;step()}
document.getElementById('replay').onclick=()=>start(false);
document.getElementById('skip').onclick=()=>{if(!done&&!fast){fast=true;mc.port2.postMessage(0)}};
document.getElementById('save').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.download='magpie-marginalia.png';a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png');
start(qs.has('instant')||location.hash==='#instant');
